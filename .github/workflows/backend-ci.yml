name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/production-readiness-phase1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate and compile Prisma client
        run: npm run build
        env:
          DATABASE_URL: mysql://user:password@localhost:3306/brokerflow_test
      - run: npm run check:syntax
      - run: npm test
      - name: Fail on high or critical dependency vulnerabilities
        run: npm run audit
